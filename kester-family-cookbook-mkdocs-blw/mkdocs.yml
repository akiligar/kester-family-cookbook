site_name: Kester Family Cookbook
site_description: Family recipe records with Baby-Led Weaning adaptations
site_url: https://yourdomain.com/cookbook/

theme:
  name: readthedocs
  highlightjs: false

nav:
  - Home: index.md
  - Recipes:
      - Recipe Index: recipes/index.md
      - Example Family Chicken Dinner: recipes/example-family-chicken/index.md
  - Templates:
      - Recipe Template: templates/recipe-template.md

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - tables
  - toc:
      permalink: true
